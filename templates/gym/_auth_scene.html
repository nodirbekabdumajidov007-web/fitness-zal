<div class="scene gymroom" data-scene aria-hidden="true">
  <div class="layer sky-stars" data-depth="0.05"></div>
  <div class="layer" data-depth="0.08"><span class="moon"></span></div>
  <svg class="layer full" data-depth="0.15" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <defs>
      <filter id="neon2" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- wall with two big windows (the panes are holes, so the sky and the moon show through) -->
    <path class="wall" fill-rule="evenodd" d="M-200-100H1800V1000H-200Z
      M150 120h195v170H150zM360 120h195v170H360zM150 305h195v170H150zM360 305h195v170H360z
      M1045 120h195v170h-195zM1255 120h195v170h-195zM1045 305h195v170h-195zM1255 305h195v170h-195z"/>
    <rect class="sill" x="135" y="478" width="435" height="12" rx="3"/><rect class="sill" x="1030" y="478" width="435" height="12" rx="3"/>
    <text class="neon" x="355" y="568" text-anchor="middle" filter="url(#neon2)">FITNES ZAL</text>
    <polyline class="ecg" points="1050,560 1130,560 1152,560 1166,522 1182,602 1200,532 1212,560 1300,560 1322,560 1336,530 1350,590 1364,560 1450,560"
              pathLength="100" filter="url(#neon2)"/>
    <rect class="base" x="-200" y="690" width="2000" height="14"/>
  </svg>
  <svg class="layer full" data-depth="0.25" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <defs><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="beam-a"/><stop offset="1" class="beam-b"/></linearGradient></defs>
    <g class="lamp" style="--o:380px"><line x1="380" y1="-20" x2="380" y2="120"/><path class="beam" d="M352 158L250 760H510L408 158Z"/><path class="shade" d="M345 118h70l20 40h-110z"/><circle class="bulb" cx="380" cy="160" r="7"/></g>
    <g class="lamp b" style="--o:800px"><line x1="800" y1="-20" x2="800" y2="100"/><path class="beam" d="M772 138L670 760H930L828 138Z"/><path class="shade" d="M765 98h70l20 40h-110z"/><circle class="bulb" cx="800" cy="140" r="7"/></g>
    <g class="lamp c" style="--o:1220px"><line x1="1220" y1="-20" x2="1220" y2="120"/><path class="beam" d="M1192 158L1090 760H1350L1248 158Z"/><path class="shade" d="M1185 118h70l20 40h-110z"/><circle class="bulb" cx="1220" cy="160" r="7"/></g>
  </svg>
  <svg class="layer full" data-depth="0.4" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <defs>
      <g id="db"><rect x="0" y="0" width="9" height="26" rx="2"/><rect x="9" y="9" width="30" height="8" rx="2"/><rect x="39" y="0" width="9" height="26" rx="2"/></g>
    </defs>
    <path class="floor" d="M-200 700H1800V1000H-200Z"/>
    <path class="floor-lines" d="M0 760H1600M0 830H1600M300 700L120 900M600 700L520 900M1000 700L1080 900M1300 700L1480 900" fill="none"/>
    <!-- dumbbell rack -->
    <g class="eq">
      <rect x="110" y="600" width="400" height="10" rx="3"/><rect x="100" y="655" width="420" height="10" rx="3"/>
      <rect x="120" y="600" width="10" height="100"/><rect x="490" y="600" width="10" height="100"/>
      <use href="#db" x="132" y="572"/><use href="#db" x="196" y="572"/><use href="#db" x="260" y="572"/><use href="#db" x="324" y="572"/><use href="#db" x="388" y="572"/><use href="#db" x="452" y="572"/>
      <use href="#db" x="122" y="626"/><use href="#db" x="190" y="626"/><use href="#db" x="258" y="626"/><use href="#db" x="326" y="626"/><use href="#db" x="394" y="626"/><use href="#db" x="462" y="626"/>
    </g>
    <!-- power cage with a loaded barbell -->
    <g class="eq">
      <rect x="1130" y="400" width="14" height="300"/><rect x="1430" y="400" width="14" height="300"/><rect x="1120" y="392" width="334" height="14" rx="3"/>
      <rect class="eq2" x="1180" y="430" width="8" height="270"/><rect class="eq2" x="1386" y="430" width="8" height="270"/>
      <rect x="1080" y="556" width="414" height="8" rx="3"/>
      <rect x="1096" y="516" width="20" height="88" rx="4"/><rect x="1118" y="526" width="14" height="68" rx="3"/>
      <rect x="1458" y="516" width="20" height="88" rx="4"/><rect x="1442" y="526" width="14" height="68" rx="3"/>
    </g>
  </svg>
  <svg class="layer full" data-depth="0.6" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <!-- punching bag swinging from the ceiling -->
    <g class="bag"><line x1="1080" y1="-20" x2="1080" y2="330"/><rect class="bag-body" x="1042" y="330" width="76" height="210" rx="30"/><rect class="bag-band" x="1042" y="370" width="76" height="12"/><rect class="bag-band" x="1042" y="490" width="76" height="12"/></g>
    <!-- bench press -->
    <g class="eq">
      <rect x="590" y="560" width="10" height="100"/><rect x="860" y="560" width="10" height="100"/>
      <rect x="560" y="565" width="340" height="8" rx="3"/>
      <rect x="548" y="526" width="18" height="86" rx="4"/><rect x="894" y="526" width="18" height="86" rx="4"/>
      <rect x="610" y="650" width="240" height="20" rx="10"/><rect x="640" y="670" width="12" height="60"/><rect x="808" y="670" width="12" height="60"/>
    </g>
    <!-- kettlebells -->
    <g class="eq"><circle cx="420" cy="752" r="24"/><path class="kb" d="M402 735a18 18 0 0 1 36 0" fill="none" stroke-width="8"/>
      <circle cx="478" cy="758" r="18"/><path class="kb" d="M465 745a13 13 0 0 1 26 0" fill="none" stroke-width="6"/></g>
  </svg>
  <svg class="layer full" data-depth="0.9" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <g class="plate"><circle cx="70" cy="900" r="170"/><circle class="ring" cx="70" cy="900" r="130" fill="none" stroke-width="6"/><circle class="hole" cx="70" cy="900" r="22"/></g>
    <g class="eq near"><rect x="1300" y="836" width="220" height="16" rx="6"/><rect x="1270" y="796" width="34" height="96" rx="8"/><rect x="1516" y="796" width="34" height="96" rx="8"/></g>
  </svg>
  <div class="layer dust" data-depth="1">{% for i in "123456789012" %}<i style="--i:{{ forloop.counter }}"></i>{% endfor %}</div>
  <div class="layer fog" data-depth="1"></div>
</div>
