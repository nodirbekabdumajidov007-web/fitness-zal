{% extends "gym/base.html" %}{% load gym_tags %}
{% block title %}{% t 'verify_phone' %}{% endblock %}
{% block content %}
<div class="card grid" style="max-width:460px;margin-inline:auto;width:100%">
  <h2>{% t 'verify_phone' %}</h2>
  <p class="muted" style="margin:0">{% t 'verify_help' %} <b class="num">{{ user.phone }}</b></p>
  <form method="post">{% csrf_token %}<input type="hidden" name="action" value="send"><button class="btn" type="submit">{% t 'send_code' %}</button></form>
  <form class="grid" method="post" novalidate>
    {% csrf_token %}<input type="hidden" name="action" value="check">
    <label for="vc">{% t 'sms_code' %}<input id="vc" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
    {% if error %}<span class="field-err" role="alert">{% t error %}</span>{% endif %}
    <button class="btn primary" type="submit">{% t 'confirm' %}</button>
  </form>
</div>
{% endblock %}
