{% load gym_tags fz_admin %}<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A'zo kartasi {{ u.member_code }} | Fitnes Zal</title>
<link rel="stylesheet" href="{% vstatic 'css/desk.css' %}">
</head>
<body class="dk-doc">
<main class="dk-paper">
  <header class="dk-paper-head"><b class="dk-brand">FITNES<i>.</i>ZAL</b><h1>A'zo kartasi</h1></header>
  <div class="dk-qr big">{{ qr }}</div>
  <p class="dk-card-name">{{ u.full_name }}</p>
  <p class="dk-card-code num">{{ u.member_code }}</p>
  <p class="dk-sub center">Kirishda shu QR kodni qabulxonada ko'rsating.{% if gs.phone %} Savollar: +998 {{ gs.phone }}{% endif %}</p>
  <p class="dk-actions noprint"><button type="button" class="dk-btn primary" onclick="window.print()">{% aicon 'printer' %}Chop etish</button> <a class="dk-btn" href="{% url 'admin:desk' %}?q={{ u.member_code|urlencode }}">Qabulxonaga qaytish</a></p>
</main>
</body>
</html>
