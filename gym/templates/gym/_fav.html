{% load gym_tags %}{% if user.is_authenticated %}<form class="fav-form" method="post" action="{% url 'favorite_toggle' p.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="fav-btn{% if p.pk in fav %} on{% endif %}" aria-pressed="{% if p.pk in fav %}true{% else %}false{% endif %}" aria-label="{% t 'fav_add' %}" title="{% t 'fav_add' %}">{% icon 'heart' %}</button></form>{% endif %}
