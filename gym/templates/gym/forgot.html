{% extends "gym/base.html" %}{% load gym_tags %}
{% block title %}{% t 'forgot' %}{% endblock %}
{% block content %}
<form class="card grid" method="post" novalidate style="max-width:460px;margin-inline:auto;width:100%">
  {% csrf_token %}
  <h2>{% t 'forgot' %}</h2>
  <p class="muted" style="margin:0">{% t 'forgot_help' %}</p>
  <label for="id_phone">{% t 'phone' %}<div class="phone"><span>+998</span><input id="id_phone" name="phone" inputmode="numeric" autocomplete="tel-national" placeholder="XX XXX XX XX" maxlength="17" value="{{ form.phone.value|default:'' }}" data-phone></div></label>
  {% for e in form.phone.errors %}<span class="field-err">{% t e %}</span>{% endfor %}
  {% if error %}<span class="field-err" role="alert">{% t error %}</span>{% endif %}
  <button class="btn primary" type="submit">{% t 'send_code' %}</button>
  <a href="{% url 'login' %}">{% t 'login' %}</a>
</form>
{% endblock %}
