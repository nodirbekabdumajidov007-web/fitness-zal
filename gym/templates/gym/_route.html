{% load gym_tags %}{% with r=gs.routes %}{% if r %}<details class="route{% if variant %} {{ variant }}{% endif %}">
  <summary class="route-btn"><span class="rb-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg></span><span class="rb-txt">{% t 'find_route' %}</span><span class="rb-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></span></summary>
  <div class="route-menu" role="menu">
    <a role="menuitem" href="{{ r.yandex }}" target="_blank" rel="noopener"><b class="ym">Я</b>Yandex {% t 'maps' %}</a>
    <a role="menuitem" href="{{ r.google }}" target="_blank" rel="noopener"><b class="gm">G</b>Google {% t 'maps' %}</a>
    {% if r.taxi %}<a role="menuitem" href="{{ r.taxi }}" target="_blank" rel="noopener"><b class="yg">Go</b>Yandex Go <small>{% t 'taxi_to_gym' %}</small></a>{% endif %}
  </div>
</details>{% endif %}{% endwith %}
