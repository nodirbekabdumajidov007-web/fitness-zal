<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"></head>
<body style="margin:0;padding:24px 12px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden">
<tr><td style="background:#111827;color:#ffffff;padding:20px 24px;font-size:18px;font-weight:bold;letter-spacing:.5px">{{ gym }}</td></tr>
<tr><td style="padding:28px 24px 8px">
<h1 style="margin:0 0 8px;font-size:20px">{{ t.ec_mail_title }}</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#374151">{{ t.ec_mail_intro }}</p>
<div style="text-align:center;margin:0 0 20px"><span style="display:inline-block;padding:14px 22px;background:#fef3c7;border:2px dashed #f59e0b;border-radius:12px;font-family:'Courier New',monospace;font-size:36px;font-weight:bold;letter-spacing:10px;color:#111827">{{ code }}</span></div>
<p style="margin:0 0 8px;font-size:14px;color:#374151">{{ t.ec_mail_valid }}</p>
<p style="margin:0 0 8px;font-size:14px;color:#b91c1c"><b>{{ t.ec_mail_secret }}</b></p>
</td></tr>
<tr><td style="padding:12px 24px 24px;font-size:13px;line-height:1.5;color:#6b7280;border-top:1px solid #e5e7eb">{{ t.ec_mail_ignore }}</td></tr>
</table></body></html>
