# Render Blueprint: one web service + one PostgreSQL database.
# SQLite is not used in production because the disk of a free web service is wiped on every deploy.
services:
  - type: web
    name: fitnes-zal
    runtime: python
    buildCommand: "bash build.sh"   # works even when the file lost its executable bit (e.g. uploaded through GitHub's website)
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitnes-zal-db
          property: connectionString
      - key: FZ_ADMIN_PASSWORD   # set this in the Render dashboard: it becomes the admin password on first deploy
        sync: false
      - key: CLOUDINARY_URL         # cloudinary://API_KEY:API_SECRET@CLOUD_NAME (cloudinary.com -> Dashboard -> API environment variable)
        sync: false
      - key: EMAIL_HOST             # e.g. smtp.gmail.com
        sync: false
      - key: EMAIL_HOST_USER        # the sending address, e.g. yourgym@gmail.com
        sync: false
      - key: EMAIL_HOST_PASSWORD    # for Gmail: an App Password (Google account -> Security -> App passwords), not the normal password
        sync: false
      - key: VAPID_PUBLIC_KEY       # Web Push: `python manage.py generate_vapid` prints both keys
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT          # optional, e.g. mailto:you@example.com
        sync: false
      - key: ANDROID_PACKAGE_NAME   # Google Play app id, e.g. uz.fitneszal.app (docs/ANDROID.md)
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS   # comma-separated SHA-256 signing fingerprints (docs/ANDROID.md)
        sync: false
      - key: IG_APP_SECRET          # Instagram Direct bot (docs/INSTAGRAM.md): Meta app -> App settings -> Basic -> App secret
        sync: false
      - key: IG_VERIFY_TOKEN        # any long random text you invent; the same text goes into the Meta webhook form
        sync: false
      - key: IG_ACCESS_TOKEN        # long-lived Instagram user token (refreshed automatically afterwards)
        sync: false
      - key: IG_ACCOUNT_ID          # optional: your Instagram user id
        sync: false
      - key: IG_API_VERSION         # Graph API version
        value: "v27.0"
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: fitnes-zal-db
    databaseName: fitnes_zal
    plan: free
