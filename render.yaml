# Render Blueprint: one web service + one PostgreSQL database.
# SQLite is not used in production because the disk of a free web service is wiped on every deploy.
services:
  - type: web
    name: fitnes-zal
    runtime: python
    buildCommand: "bash build.sh"   # works even when the file lost its executable bit (e.g. uploaded through GitHub's website)
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitnes-zal-db
          property: connectionString
      - key: FZ_ADMIN_PASSWORD   # set this in the Render dashboard: it becomes the admin password on first deploy
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: fitnes-zal-db
    databaseName: fitnes_zal
    plan: free
